name: 'Fragnesia fix + config set by brand'
description: 'TestA = BPF pair, TestB = hardening+fs, TestC = both'

runs:
  using: "composite"
  steps:
    - name: Fix CVE-2026-46300 (flag lost on coalesce)
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import sys
        MARK = "CVE-2026-46300"
        p = "net/core/skbuff.c"
        src = open(p).read()
        if MARK in src:
            print("%s: already patched" % p)
            sys.exit(0)
        OLD = ("\tmemcpy(to_shinfo->frags + to_shinfo->nr_frags,\n"
               "\t       from_shinfo->frags,\n"
               "\t       from_shinfo->nr_frags * sizeof(skb_frag_t));\n"
               "\tto_shinfo->nr_frags += from_shinfo->nr_frags;\n")
        NEW = OLD + "\tto_shinfo->flags |= from_shinfo->flags & SKBFL_SHARED_FRAG; /* CVE-2026-46300 */\n"
        n = src.count(OLD)
        if n != 1:
            print("%s: ERROR - %d matches instead of 1" % (p, n))
            sys.exit(1)
        open(p, "w").write(src.replace(OLD, NEW, 1))
        print("%s: patched" % p)
        PYEOF

    - name: BPF pair (TestA / TestC)
      if: ${{ startsWith(github.event.inputs.brand_name, 'TestA') || startsWith(github.event.inputs.brand_name, 'TestC') }}
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_BPF_LSM=y
          CONFIG_BPF_UNPRIV_DEFAULT_OFF=y

    - name: Hardening + fs configs (TestB / TestC)
      if: ${{ startsWith(github.event.inputs.brand_name, 'TestB') || startsWith(github.event.inputs.brand_name, 'TestC') }}
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_INIT_ON_FREE_DEFAULT_ON=y
          CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y
          CONFIG_SECURITY_DMESG_RESTRICT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_MACVLAN=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_SQUASHFS_ZSTD=y

    - name: Single harmless config (TestD)
      if: ${{ startsWith(github.event.inputs.brand_name, 'TestD') }}
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_SQUASHFS=y

    - name: Probe TestE
      if: ${{ startsWith(github.event.inputs.brand_name, 'TestE') }}
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_BPF_LSM=y

    - name: Probe TestF
      if: ${{ startsWith(github.event.inputs.brand_name, 'TestF') }}
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_BPF_UNPRIV_DEFAULT_OFF=y

    - name: Probe TestG
      if: ${{ startsWith(github.event.inputs.brand_name, 'TestG') }}
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_INIT_ON_FREE_DEFAULT_ON=y

    - name: Probe TestH
      if: ${{ startsWith(github.event.inputs.brand_name, 'TestH') }}
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y
          CONFIG_SECURITY_DMESG_RESTRICT=y

    - name: Probe TestI
      if: ${{ startsWith(github.event.inputs.brand_name, 'TestI') }}
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_CGROUP_DEVICE=y
          CONFIG_MACVLAN=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_SQUASHFS_ZSTD=y

    - name: Fragnesia segment half (Full*)
      if: ${{ startsWith(github.event.inputs.brand_name, 'Full') }}
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import sys
        p = "net/core/skbuff.c"
        src = open(p).read()
        if "CVE-2026-46300-seg" in src:
            print("%s: already patched" % p); sys.exit(0)

        OLD1 = "\t\t\t\tfrag_skb = list_skb;\n"
        NEW1 = OLD1 + "\t\t\t\tskb_shinfo(nskb)->flags |= skb_shinfo(frag_skb)->flags & SKBFL_SHARED_FRAG; /* CVE-2026-46300-seg */\n"
        if src.count(OLD1) != 1:
            print("ERROR: inner-loop site matched %d times" % src.count(OLD1)); sys.exit(1)
        src = src.replace(OLD1, NEW1, 1)

        OLD2 = ("\t\tskb_shinfo(nskb)->flags |= skb_shinfo(head_skb)->flags &\n"
                "\t\t\t\t\t   SKBFL_SHARED_FRAG;\n")
        NEW2 = ("\t\tskb_shinfo(nskb)->flags |= (skb_shinfo(head_skb)->flags |\n"
                "\t\t\t\t\t    skb_shinfo(frag_skb)->flags) &\n"
                "\t\t\t\t\t   SKBFL_SHARED_FRAG; /* CVE-2026-46300-seg2 */\n")
        if src.count(OLD2) != 1:
            print("ERROR: nskb-creation site matched %d times" % src.count(OLD2)); sys.exit(1)
        src = src.replace(OLD2, NEW2, 1)

        open(p, "w").write(src)
        print("%s: segment half patched" % p)
        PYEOF

    - name: Report set
      shell: bash
      run: echo "brand=${{ github.event.inputs.brand_name }}"

name: 'Find the manager in the system image too'
description: 'Let the kernel crown a KernelSU manager that lives in /system/app, not only /data/app'

runs:
  using: composite
  steps:
    - name: Apply the manager-search patch
      shell: bash
      run: |
        set -euo pipefail
        python3 "${{ github.workspace }}/.github/ksugrant/apply.py" \
          "${{ github.workspace }}/kernel"

    - name: Verify the search covers the system image
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        T=KernelSU-Next/kernel/manager/throne_tracker.c
        test -f "$T" || { echo "ksugrant: missing $T" >&2; exit 1; }
        grep -q 'search_manager("/system/app", 2, &uid_list)' "$T" ||
          { echo "ksugrant: manager is not looked for in the image" >&2; exit 1; }
        # Only as a fallback: a manager installed in /data/app still wins.
        grep -q 'if (!ksu_is_manager_appid_valid())' "$T" ||
          { echo "ksugrant: the image search is not a fallback" >&2; exit 1; }
        # Nothing else of the old patch may survive: root for the built-in
        # list is handed out from userspace by `ksud profile set`.
        A=KernelSU-Next/kernel/policy/allowlist.c
        grep -q 'ksu_builtin' "$A" &&
          { echo "ksugrant: the old built-in list is still patched in" >&2; exit 1; }
        echo "ksugrant: manager search in the image is in place, nothing else touched"

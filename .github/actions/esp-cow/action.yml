name: 'CVE-2026-43284 ESP fix + extra configs'
description: 'Force skb_cow_data() for nonlinear skbs in ESP input, and enable extra kernel configs'

inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: false

runs:
  using: "composite"
  steps:
    - name: Fix CVE-2026-43284 (xfrm-ESP page-cache write)
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import re, sys

        RX = re.compile(
            r"\}\s*else\s+if\s*\(\s*!skb_has_frag_list\(skb\)\s*\)\s*\{"
            r".*?goto\s+skip_cow\s*;\s*\}", re.S)
        NEW = "}  /* CVE-2026-43284: nonlinear skb always via skb_cow_data() */"
        MARK = "CVE-2026-43284"

        rc = 0
        for path in ("net/ipv4/esp4.c", "net/ipv6/esp6.c"):
            src = open(path).read()
            if MARK in src:
                print("%s: already patched" % path)
                continue
            body = re.search(r"static int esp6?_input\(struct xfrm_state.*?\nskip_cow:", src, re.S)
            if not body:
                print("%s: ERROR - esp_input body not found" % path)
                rc = 1
                continue
            seg = body.group(0)
            new_seg, n = RX.subn(NEW, seg, count=1)
            if n != 1:
                print("%s: ERROR - fast path not found, dumping region:" % path)
                m = re.search(r".{0,400}skb_cloned\(skb\).{0,600}", seg, re.S)
                print(repr(m.group(0)) if m else repr(seg[:800]))
                rc = 1
                continue
            open(path, "w").write(src.replace(seg, new_seg, 1))
            print("%s: patched" % path)
        sys.exit(rc)
        PYEOF

    - name: Verify the fix is in the tree
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        for f in net/ipv4/esp4.c net/ipv6/esp6.c; do
          grep -q "CVE-2026-43284" "$f" || { echo "no marker in $f"; exit 1; }
          BODY="$(awk '/^static int esp6?_input\(struct xfrm_state/,/^skip_cow:/' "$f")"
          [ "$(printf '%s\n' "$BODY" | wc -l)" -gt 20 ] || { echo "esp_input body not found in $f"; exit 1; }
          printf '%s\n' "$BODY" | grep -q "skb_cow_data" || { echo "no skb_cow_data in $f"; exit 1; }
          printf '%s\n' "$BODY" | grep -q "skb_has_frag_list" && { echo "fast path still present in $f"; exit 1; }
          echo "$f: verified"
        done

    - name: Enable extra kernel configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_CGROUP_DEVICE=y
          CONFIG_MACVLAN=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_SQUASHFS_ZSTD=y
